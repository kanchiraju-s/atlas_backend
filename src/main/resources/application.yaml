spring:
  application:
    name: atlas-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

atlas:
  jwt:
    secret: ${ATLAS_JWT_SECRET:atlas-local-dev-secret-must-be-at-least-32-chars-long}
  google:
    client-id: ${ATLAS_GOOGLE_CLIENT_ID:476490077698-iv7t18ocilpldlegqtm5itsnmh5j2kt4.apps.googleusercontent.com}
